name: Deploy GitHub Pages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Monaco Shuffler</title>
            <style>
              :root {
                color-scheme: dark;
                --bg: #09111d;
                --bg2: #141d30;
                --panel: rgba(255,255,255,.08);
                --panel-strong: rgba(255,255,255,.12);
                --border: rgba(255,255,255,.16);
                --text: #f5f8ff;
                --muted: #b8c3da;
                --accent: #64b4ff;
                --accent-2: #9ff0bf;
                --code-bg: rgba(8, 13, 22, .9);
              }
              body {
                margin: 0;
                min-height: 100vh;
                font-family: "Segoe UI", Arial, Helvetica, sans-serif;
                background:
                  radial-gradient(circle at top left, rgba(100,180,255,.18), transparent 32%),
                  radial-gradient(circle at top right, rgba(159,240,191,.12), transparent 24%),
                  linear-gradient(145deg, var(--bg2), var(--bg));
                color: var(--text);
                display: block;
              }
              .shell {
                width: min(1180px, calc(100vw - 32px));
                margin: 0 auto;
                padding: 32px 0 64px;
              }
              .hero {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 24px;
                padding: 32px;
                box-shadow: 0 24px 80px rgba(0,0,0,.35);
                backdrop-filter: blur(18px);
              }
              h1, h2, h3 { margin-top: 0; }
              h1 { font-size: clamp(2rem, 4vw, 3.4rem); margin-bottom: .35rem; }
              h2 { margin-bottom: .75rem; }
              h3 { margin-bottom: .45rem; }
              p { line-height: 1.6; }
              .muted { color: var(--muted); }
              .kicker {
                display: inline-block;
                padding: .3rem .7rem;
                border-radius: 999px;
                background: rgba(100, 180, 255, .12);
                border: 1px solid rgba(100, 180, 255, .22);
                color: var(--accent);
                font-size: .9rem;
                margin-bottom: 1rem;
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 18px;
                margin-top: 20px;
              }
              .card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 20px;
                padding: 22px;
              }
              .card strong { color: var(--accent-2); }
              .toc {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin: 18px 0 0;
              }
              .toc a {
                color: var(--text);
                text-decoration: none;
                padding: .45rem .7rem;
                border-radius: 999px;
                background: rgba(255,255,255,.06);
                border: 1px solid rgba(255,255,255,.10);
              }
              .toc a:hover { border-color: rgba(100,180,255,.55); }
              section { margin-top: 22px; }
              code {
                background: var(--code-bg);
                padding: 0.15rem 0.35rem;
                border-radius: 6px;
              }
              pre {
                margin: 0;
                overflow: auto;
                background: var(--code-bg);
                border: 1px solid rgba(255,255,255,.08);
                border-radius: 16px;
                padding: 18px;
                line-height: 1.55;
              }
              ul { line-height: 1.6; }
              a { color: var(--accent); }
              .tiny { font-size: .92rem; }
              .example {
                background: rgba(8, 13, 22, .55);
                border: 1px solid rgba(255,255,255,.08);
                border-radius: 18px;
                padding: 18px;
                margin-top: 12px;
              }
            </style>
          </head>
          <body>
            <div class="shell">
              <main class="hero">
                <span class="kicker">GitHub Pages release site for <code>${GITHUB_REF_NAME}</code></span>
                <h1>Monaco Shuffler</h1>
                <p class="muted">This release page documents the public classes and workflow used by the Monaco Shuffler desktop app. It is generated from the tagged source that produced this release.</p>
                <div class="toc">
                  <a href="#overview">Overview</a>
                  <a href="#core">Core classes</a>
                  <a href="#gui">GUI classes</a>
                  <a href="#examples">Examples</a>
                </div>

                <section id="overview">
                  <h2>Overview</h2>
                  <div class="grid">
                    <div class="card">
                      <strong>Purpose</strong>
                      <p>The app loads a Monaco plan from the configured database root, lets the user preview a reordered layer list, and writes the updated structure block back to the same file.</p>
                    </div>
                    <div class="card">
                      <strong>Startup</strong>
                      <p>The GUI opens immediately. The Open button prompts for an MRN, then a plan name, and only then resolves the final file path.</p>
                    </div>
                    <div class="card">
                      <strong>Saved file shape</strong>
                      <p>The serializer preserves the original surrounding text and rewrites only the matched structure block.</p>
                    </div>
                  </div>
                </section>

                <section id="core">
                  <h2>Core classes</h2>
                  <div class="card">
                    <h3>StructuresNotFoundError</h3>
                    <p class="tiny">Raised when no valid Monaco block can be detected in the input text. This tells the GUI that the file does not match the structure-list contract, rather than treating the error as a generic I/O failure.</p>
                  </div>
                  <div class="card" style="margin-top:14px;">
                    <h3>StructureRecord</h3>
                    <p class="tiny">Represents one structure row. The class stores the human-readable name, the original layer number, and the raw CSV fields so the serializer can preserve the file's shape while updating the layer value.</p>
                  </div>
                  <div class="card" style="margin-top:14px;">
                    <h3>StructureDocument</h3>
                    <p class="tiny">Captures the parsed record list plus the original file text and block boundaries. The GUI uses this object when it needs to rewrite only the matched section without touching unrelated content.</p>
                  </div>
                </section>

                <section id="gui">
                  <h2>GUI classes</h2>
                  <div class="card">
                    <h3>GlassCard</h3>
                    <p class="tiny">A presentation-only wrapper around <code>QFrame</code>. It gives the interface its translucent panels and shadowed depth.</p>
                  </div>
                  <div class="card" style="margin-top:14px;">
                    <h3>RowWidget</h3>
                    <p class="tiny">One row in the reorder table. It exposes the original layer badge, the structure name, a target-layer selector, and a preview label that is filled in after the user confirms a reorder.</p>
                  </div>
                  <div class="card" style="margin-top:14px;">
                    <h3>MonacoShufflerApp</h3>
                    <p class="tiny">The main window class. It owns the prompts, the table, the preview logic, and the save confirmation. It intentionally keeps the filesystem path hidden from the user and only shows the MRN and plan name they chose.</p>
                  </div>
                </section>

                <section id="examples">
                  <h2>Non-trivial examples</h2>
                  <div class="example">
                    <h3>Parse, preview, and serialize a plan</h3>
                    <pre><code>from pathlib import Path

from monaco_shuffler.core import (
    build_preview_order,
    load_structure_file,
    render_structure_document,
)

document = load_structure_file(Path(r"C:\GitHub\MonacoDatabase\1~12345678\plan\Hip Plan\plan.txt"))
preview = build_preview_order(document.records, [2, 1, 3, 4])
updated_text = render_structure_document(document, preview)

print(updated_text.splitlines()[0])
print(f"Preview contains {len(preview)} reordered structures")</code></pre>
                  </div>

                  <div class="example" style="margin-top:14px;">
                    <h3>Open the GUI and launch the MRN/plan flow</h3>
                    <pre><code>from PySide6.QtWidgets import QApplication

from monaco_shuffler.gui import MonacoShufflerApp

app = QApplication([])
window = MonacoShufflerApp(initial_records=[], source_path=None)
window.show()

# The user clicks Open, enters an MRN, picks a plan, and the app loads
# the matching plan file without exposing the underlying file browser.
app.exec()</code></pre>
                  </div>

                  <div class="example" style="margin-top:14px;">
                    <h3>Handle missing plan folders explicitly</h3>
                    <pre><code>from pathlib import Path

from monaco_shuffler.core import resolve_mrn_folder, resolve_plan_file

mrn_folder = resolve_mrn_folder("12345678", Path(r"C:\GitHub\MonacoDatabase"))
try:
    plan_file = resolve_plan_file(mrn_folder, "Hip Plan")
except ValueError as exc:
    print(f"Plan lookup failed: {exc}")</code></pre>
                  </div>
                </section>

                <section>
                  <h2>Release notes</h2>
                  <p class="tiny">GitHub Pages updates when a <code>v*.*.*</code> tag is pushed. The executable build remains a manual action, while this page is a browsable summary of the code shipped in the release.</p>
                  <p><a href="https://github.com/${GITHUB_REPOSITORY}">View the repository</a></p>
                </section>
              </main>
            </div>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4