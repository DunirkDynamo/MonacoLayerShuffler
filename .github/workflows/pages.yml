name: Deploy GitHub Pages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p site
          python3 - <<'PY'
          from pathlib import Path
          import os

          template_path = Path("pages/index.html.template")
          output_path = Path("site/index.html")
          html = template_path.read_text(encoding="utf-8")
          html = html.replace("__GITHUB_REF_NAME__", os.environ["GITHUB_REF_NAME"])
          html = html.replace("__GITHUB_REPOSITORY__", os.environ["GITHUB_REPOSITORY"])
          html = html.replace("__VERSION__", os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          output_path.write_text(html, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4